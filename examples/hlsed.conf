# hlsed configuration — one watch= line per monitored directory,
# scan-interval in seconds, pid-file for the daemon lock.
# Validate before enabling:  hlsed --check /path/to/hlsed.conf

watch           = /etc
watch           = /usr/bin
scan-interval   = 60
pid-file        = /run/hlsed.pid

# Optional: persist the dedup table (path/mtime/size tuples only) so a
# restart does not re-alert every unchanged file. Omit for memory-only.
#state-file      = /var/lib/hlsed/dedup.state
